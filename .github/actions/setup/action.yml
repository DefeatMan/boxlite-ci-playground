name: Prepare BoxLite worker
description: Install only the tools needed by this fixture and check worker isolation
inputs:
  node-version:
    description: Node.js major version
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install make
      shell: bash
      run: |
        if ! command -v make >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make
        fi
    - name: Check worker isolation
      shell: bash
      run: make isolation
